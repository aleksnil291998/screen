<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трансляция: {{ stream_id }}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background-color: #333;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .header h1 {
            font-size: 18px;
            font-weight: normal;
        }
        .header a {
            color: #4CAF50;
            text-decoration: none;
            padding: 8px 15px;
            border: 1px solid #4CAF50;
            border-radius: 5px;
            transition: all 0.3s;
        }
        .header a:hover {
            background-color: #4CAF50;
            color: white;
        }
        .stream-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        #streamCanvas {
            max-width: 100%;
            max-height: calc(100vh - 100px);
            background-color: #000;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .status {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0,0,0,0.8);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
        }
        .status.connected {
            background-color: rgba(76, 175, 80, 0.9);
        }
        .status.disconnected {
            background-color: rgba(244, 67, 54, 0.9);
        }
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #888;
        }
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #333;
            border-top-color: #4CAF50;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📱 Трансляция: <strong>{{ stream_id }}</strong></h1>
        <a href="/">← На главную</a>
    </div>
    
    <div class="stream-container">
        <div id="loading" class="loading">
            <div class="loading-spinner"></div>
            <p>Ожидание трансляции...</p>
        </div>
        <canvas id="streamCanvas" class="hidden"></canvas>
    </div>
    
    <div id="status" class="status disconnected">Отключено</div>
    
    <script>
        const streamId = '{{ stream_id }}';
        const canvas = document.getElementById('streamCanvas');
        const ctx = canvas.getContext('2d');
        const loading = document.getElementById('loading');
        const statusEl = document.getElementById('status');
        
        let ws = null;
        let reconnectAttempts = 0;
        const maxReconnectAttempts = 5;
        const reconnectDelay = 3000;
        
        function updateStatus(message, connected) {
            statusEl.textContent = message;
            statusEl.className = 'status ' + (connected ? 'connected' : 'disconnected');
        }
        
        function connect() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/stream/${streamId}/`;
            
            updateStatus('Подключение...', false);
            
            ws = new WebSocket(wsUrl);
            
            ws.binaryType = 'arraybuffer';
            
            ws.onopen = function() {
                console.log('Connected to stream');
                updateStatus('Подключено', true);
                reconnectAttempts = 0;
            };
            
            ws.onmessage = function(event) {
                // Hide loading, show canvas
                loading.classList.add('hidden');
                canvas.classList.remove('hidden');
                
                // Create image from binary data
                const blob = new Blob([event.data], {type: 'image/jpeg'});
                const img = new Image();
                
                img.onload = function() {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                };
                
                img.src = URL.createObjectURL(blob);
            };
            
            ws.onclose = function() {
                console.log('Disconnected from stream');
                updateStatus('Отключено', false);
                
                // Try to reconnect
                if (reconnectAttempts < maxReconnectAttempts) {
                    reconnectAttempts++;
                    setTimeout(connect, reconnectDelay);
                    updateStatus(`Переподключение... (попытка ${reconnectAttempts}/${maxReconnectAttempts})`, false);
                } else {
                    updateStatus('Соединение потеряно. Обновите страницу.', false);
                }
            };
            
            ws.onerror = function(error) {
                console.error('WebSocket error:', error);
                updateStatus('Ошибка соединения', false);
            };
        }
        
        // Initial connection
        connect();
        
        // Cleanup on page unload
        window.addEventListener('beforeunload', function() {
            if (ws) {
                ws.close();
            }
        });
    </script>
</body>
</html>
